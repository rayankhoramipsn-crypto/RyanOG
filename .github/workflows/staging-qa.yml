name: Staging static QA
on:
  push:
    branches:
      - staging/triso-test
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript syntax and public secrets
        run: |
          node scripts/qa-static.mjs
          node --check preview/app.js
          if grep -R -n 'zrolxgzndinktsjsthfw' preview; then echo 'Production project reference in preview'; exit 1; fi
