name: Deploy TRISOCMD preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble preview site
        run: |
          mkdir -p _site
          cp preview/index.html snowflake.png _site/
          test -s _site/index.html
          test -s _site/snowflake.png
          grep -q 'TRISOCMD' _site/index.html
          grep -q 'cxtytbjvdlngahytfilr.supabase.co' _site/index.html
          ! grep -q 'zrolxgzndinktsjsthfw' _site/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v5
