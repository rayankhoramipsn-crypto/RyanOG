name: Build staging preview artifact

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check staging routes
        run: python3 tests/test_staging_routes.py
      - name: Assemble preview site
        run: |
          mkdir -p _site/preview
          cp -a preview/. _site/preview/
          cp snowflake.png _site/
          test -s _site/preview/marketplace.html
          test -s _site/preview/index.html
          test -s _site/snowflake.png
          test -s _site/preview/blog/index.html
          test -s _site/preview/product.html
          grep -q 'TRISOCMD' _site/preview/index.html
          grep -q 'cxtytbjvdlngahytfilr.supabase.co' _site/preview/index.html
          ! grep -q 'zrolxgzndinktsjsthfw' _site/preview/index.html
      - name: Upload staging artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: staging-preview
          path: ./_site
