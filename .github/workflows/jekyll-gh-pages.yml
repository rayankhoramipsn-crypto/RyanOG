name: Validate TRISOCMD staging preview (no deployment)
on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - '.github/workflows/jekyll-gh-pages.yml'
  pull_request:
    paths:
      - 'preview/**'
      - '.github/workflows/jekyll-gh-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
# Pages deployment handled only by deploy-main-pages.yml.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check staging safety and routes
        run: |
          test -s preview/index.html
          test -s preview/marketplace.html
          test -s preview/admin/index.html
          test -s preview/blog/index.html
          test -s preview/help/index.html
          test -s preview/videos/index.html
          grep -q 'TRISOCMD' preview/index.html
          grep -q 'cxtytbjvdlngahytfilr.supabase.co' preview/index.html
          ! grep -q 'zrolxgzndinktsjsthfw' preview/index.html
