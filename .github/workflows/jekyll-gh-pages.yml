name: Deploy TRISOCMD staging preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging preview
        uses: actions/checkout@v4
        with:
          ref: staging/triso-test
      - name: Verify staging preview before publishing
        run: |
          node scripts/qa-static.mjs
          node --check preview/app.js
          node scripts/qa-preview.mjs
          if grep -R -n 'zrolxgzndinktsjsthfw' preview; then
            echo 'Production Supabase reference detected'
            exit 1
          fi
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload preview only
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
