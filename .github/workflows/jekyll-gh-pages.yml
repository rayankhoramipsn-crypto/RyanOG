name: Build staging preview artifact
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble complete staging site
        run: |
          mkdir -p _preview
          cp -a preview/. _preview/
          touch _preview/.nojekyll
          test -s _preview/assets/commerce.css
          test -s _preview/assets/commerce.js
          test -s _preview/assets/marketplace.js
          test -s _preview/product.html
          test -s _preview/admin/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: trisocmd-staging-preview
          path: _preview/
# No Pages deployment: staging artifacts must never compete with the production domain.
