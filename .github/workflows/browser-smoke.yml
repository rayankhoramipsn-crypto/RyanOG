name: TRISOCMD regression and marketplace checks
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'supabase/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Node, PostgreSQL, Python and Edge checks
        run: npm test && npm run check:edge
      - name: All isolated browser suites
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >work-http.log 2>&1 &
          curl --retry 5 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8765/ > /dev/null
          npm run test:browser
  native-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start fresh disposable local Supabase (never linked)
        run: |
          mkdir -p work/ci-supabase
          npx supabase init --workdir work/ci-supabase --yes
          npx supabase start --workdir work/ci-supabase --exclude realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor >work/supabase-start.log 2>&1
          npx supabase status --workdir work/ci-supabase --output json >work/supabase-status.json
      - name: Real local JWT and binary Storage integration
        env:
          TRISO_INTEGRATION_CONFIG: work/supabase-status.json
          TRISO_STORAGE_TESTS: '1'
          RUN_ADVISORS: '1'
        run: npm run test:integration
