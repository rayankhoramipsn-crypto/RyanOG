name: Staging static checks
on:
  pull_request:
  push:
    branches:
      - main
      - infra/trisocmd-content-foundation
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check staging routes, noindex and media safety
        run: python3 tests/test_staging_routes.py
      - name: Verify main-page layout, assets and JavaScript syntax
        run: python3 tests/test_main_ui.py
      - name: Verify persistent login and marketplace moderation
        run: python3 tests/test_marketplace_auth_admin.py
      - name: Verify buyer seller live chat and unread message safety
        run: python3 tests/test_marketplace_live_chat.py
      - name: Verify marketplace V18 management and login routing
        run: python3 tests/test_marketplace_management_v18.py
      - name: Audit all site routes, assets and backend references
        run: python3 tests/test_site_integrity.py
