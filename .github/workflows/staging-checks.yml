name: Staging static checks
on:
  pull_request:
  push:
    branches:
      - main
      - infra/trisocmd-content-foundation
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check staging routes, noindex and media safety
        run: |
          python3 tests/test_staging_routes.py
          python3 tests/test_site_artifacts.py
