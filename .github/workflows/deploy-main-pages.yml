name: Deploy TRISOCMD main site and preview to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Sole Pages deployment; serve staging preview at /preview/.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare published site
        run: |
          mkdir -p _site
          cp -a index.html marketplace.html product.html app.js luxury-dark.css snowflake.png assets admin blog videos help policies preview _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/trisocmd-neon-reference.webp
          test -s _site/luxury-dark.css
          test -s _site/app.js
          test -s _site/marketplace.html
          test -s _site/admin/index.html
          test -s _site/blog/index.html
          test -s _site/videos/index.html
          test -s _site/preview/index.html
          test -s _site/preview/admin/index.html
          test -s _site/preview/marketplace.html
          # Only accept the native storefront, never the old image hotspot overlay.
          grep -q 'class="tc-native-hero"' _site/index.html
          grep -q 'tc-native-lang-menu' _site/index.html
          ! grep -q 'tc-v9-reference-stage' _site/index.html
          test -s _site/assets/trisocmd-native-v13.css
          test -s _site/assets/trisocmd-native-v13.js
          test -s _site/assets/triso-native-fortnite.webp
          test -s _site/assets/triso-native-gear.webp
          test -s _site/assets/triso-native-digital.webp
          test -s _site/assets/triso-native-marketplace.webp
          test -s _site/assets/triso-native-hero.webp
          grep -q 'noindex,nofollow' _site/index.html
          grep -q 'STAGING PREVIEW ONLY' _site/index.html
          grep -q 'cxtytbjvdlngahytfilr.supabase.co' _site/preview/index.html
          ! grep -q 'zrolxgzndinktsjsthfw' _site/preview/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
