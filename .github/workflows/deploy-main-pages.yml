name: Deploy TRISOCMD main site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare published site
        run: |
          mkdir -p _site
          cp -a index.html marketplace.html product.html auth.js auth.html account.html admin blog videos help policies _site/
          test -s _site/auth.js
          test -s _site/auth.html
          test -s _site/account.html
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/admin/index.html
          test -s _site/blog/index.html
          test -s _site/videos/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
