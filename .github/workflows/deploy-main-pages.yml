name: Publish reviewed TRISOCMD site
# Run manually only after release approval. A merge/push never publishes the site.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare reviewed site
        run: |
          mkdir -p _site
          cp -a index.html marketplace.html product.html assets admin blog videos help policies _site/
          touch _site/.nojekyll
          test -s _site/assets/commerce.css
          test -s _site/assets/commerce.js
          test -s _site/admin/index.html
          test -s _site/blog/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish approved site
        id: deployment
        uses: actions/deploy-pages@v4
