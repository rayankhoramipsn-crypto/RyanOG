<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Product | TRISOCMD Staging</title><meta name="description" content="Product details and reviews at TRISOCMD."><style>:root{color-scheme:dark;font:16px system-ui;background:#0a0c12;color:#f5f5fa}*{box-sizing:border-box}body{max-width:1200px;margin:auto;padding:24px}a{color:#beaaff}header{display:flex;justify-content:space-between;border-bottom:1px solid #303244;padding-bottom:20px}main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,1fr);gap:36px;margin-top:45px}.panel{background:#161923;border:1px solid #343747;border-radius:20px;padding:24px}h1{font-size:clamp(28px,4vw,48px)}p{line-height:1.7;color:#c1c4d4}.price{font-size:32px;font-weight:800}.hero{width:100%;max-height:480px;object-fit:contain;border-radius:16px;background:#0d1019}.gallery{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.gallery button{width:95px;height:75px;padding:0;overflow:hidden;background:#1d2130}.gallery img{width:100%;height:100%;object-fit:cover}button,input,select{font:inherit;border-radius:10px;padding:12px;background:#171a29;color:white;border:1px solid #444b63}button{cursor:pointer;background:#6e54d1}input,select{width:100%;margin:6px 0 14px}label{display:block}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:16px}.video{margin-top:22px}.hidden{display:none!important}#notice{min-height:28px}@media(max-width:760px){main{grid-template-columns:1fr}}</style></head><body><header><a href="./index.html">TRISOCMD / SHOP</a><a href="blog/">JOURNAL</a></header><p id="notice" role="status"></p><main><section class="panel"><img id="hero" class="hero hidden" alt=""><div id="gallery" class="gallery"></div><div id="videos"></div></section><section class="panel"><p id="category"></p><h1 id="title">Loading product…</h1><p class="price" id="price"></p><p id="stock"></p><p id="description"></p><section><h2>Specifications</h2><dl id="specs"></dl></section><p class="muted">Purchasing is disabled in this staging preview until checkout security and fulfillment are verified.</p><section id="admin" class="hidden"><h2>Product media manager</h2><form id="media-form"><label>Type<select id="media-type"><option value="image">Image</option><option value="youtube">YouTube review/unboxing</option></select></label><label>HTTPS image or YouTube URL<input id="media-url" type="url" required></label><label>Caption<input id="media-label" maxlength="180"></label><label>Order<input id="media-order" type="number" min="0" value="0"></label><button type="submit">Add media</button></form><div id="media-admin"></div><h2>Manage specifications</h2><form id="spec-form"><label>Specification name<input id="spec-key" maxlength="80" required placeholder="Switch type"></label><label>Value<input id="spec-value" maxlength="500" required placeholder="Mechanical"></label><label>Display order<input id="spec-order" type="number" min="0" value="0"></label><button type="submit">Save specification</button></form><div id="spec-admin"></div></section></section></main><script>
'use strict';const URL='https://cxtytbjvdlngahytfilr.supabase.co',KEY='sb_publishable_AqZWjpgyZ_h6-EKwOySyGQ_0LE8bcRm';const $=id=>document.getElementById(id),notice=t=>{$('notice').textContent=t};const session=(()=>{try{return JSON.parse(sessionStorage.getItem('tc35_auth_session')||'null')}catch{return null}})();const token=session?.access_token,admin=session?.user?.app_metadata?.role==='admin';const id=new URLSearchParams(location.search).get('id');let product=null;
function node(tag,text){const el=document.createElement(tag);if(text!=null)el.textContent=text;return el}
async function req(path,options={}){const r=await fetch(URL+'/rest/v1/'+path,{...options,headers:{apikey:KEY,Authorization:'Bearer '+(token||KEY),'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw Error('Request failed: '+r.status+' '+(await r.text()).slice(0,200));const t=await r.text();return t?JSON.parse(t):null}
function safeImage(v){try{const u=new URL(v);return u.protocol==='https:'?u.href:null}catch{return null}}
function videoId(v){try{const u=new URL(v);const host=u.hostname.toLowerCase();let id;if(host==='youtu.be'||host==='www.youtu.be')id=u.pathname.slice(1).split('/')[0];else if(['youtube.com','www.youtube.com','m.youtube.com','www.youtube-nocookie.com'].includes(host))id=u.pathname.startsWith('/shorts/')||u.pathname.startsWith('/embed/')?u.pathname.split('/')[2]:u.pathname==='/watch'?u.searchParams.get('v'):null;return /^[a-zA-Z0-9_-]{11}$/.test(id||'')?id:null}catch{return null}}
function renderMedia(media){const images=media.filter(m=>m.media_type==='image'&&safeImage(m.media_url)),hero=$('hero'),gallery=$('gallery');gallery.replaceChildren();const main=images[0]?.media_url||safeImage(product.image_url);hero.classList.toggle('hidden',!main);if(main){hero.src=main;hero.alt=product.title}for(const m of images){const b=node('button'),im=node('img');im.src=m.media_url;im.alt=m.label||product.title;b.type='button';b.title=m.label||'Product image';b.append(im);b.onclick=()=>{hero.src=m.media_url;hero.alt=m.label||product.title};gallery.append(b)}const vids=$('videos');vids.replaceChildren();for(const m of media.filter(m=>m.media_type==='youtube')){const vid=videoId(m.media_url);if(!vid)continue;const block=node('div');block.className='video';block.append(node('h3',m.label||'Video review / unboxing'));const frame=node('iframe');frame.title=m.label||'YouTube video';frame.src='https://www.youtube-nocookie.com/embed/'+vid;frame.loading='lazy';frame.referrerPolicy='strict-origin-when-cross-origin';frame.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;block.append(frame);vids.append(block)}if(admin){const list=$('media-admin');list.replaceChildren();for(const m of media){const row=node('div');row.append(node('span',m.media_type+' — '+(m.label||m.media_url)+' '));const del=node('button','Remove');del.type='button';del.onclick=async()=>{if(!confirm('Remove this media item?'))return;try{await req('product_media?id=eq.'+m.id,{method:'DELETE'});await Promise.all([loadMedia(),loadSpecs()])}catch(e){notice(e.message)}};row.append(del);list.append(row)}}}
async function loadSpecs(){const specs=await req('product_specs?select=*&product_id=eq.'+id+'&order=sort_order.asc,id.asc');const dl=$('specs');dl.replaceChildren();if(!specs.length)dl.append(node('p','Specifications will be added soon.'));for(const item of specs){const dt=node('dt',item.spec_key),dd=node('dd',item.spec_value);dt.style.cssText='font-weight:700;margin-top:10px';dd.style.cssText='margin:0;color:#c1c4d4';dl.append(dt,dd)}if(admin){const el=$('spec-admin');el.replaceChildren();for(const item of specs){const row=node('div');row.append(node('span',item.spec_key+': '+item.spec_value+' '));const del=node('button','Remove');del.type='button';del.onclick=async()=>{if(!confirm('Remove this specification?'))return;try{await req('product_specs?id=eq.'+item.id,{method:'DELETE'});await loadSpecs()}catch(e){notice(e.message)}};row.append(del);el.append(row)}}}
async function loadMedia(){const media=await req('product_media?select=*&product_id=eq.'+id+'&order=sort_order.asc,id.asc');renderMedia(media)}
async function load(){if(!/^[0-9]{1,18}$/.test(id||''))return notice('Invalid product ID.');try{const rows=await req('products?select=id,title,description,description_ar,price,stock,status,category,image_url,seo_title,seo_description&id=eq.'+id);product=rows?.[0];if(!product)return notice('Product unavailable.');$('title').textContent=product.title;$('category').textContent=product.category||'Gaming';$('price').textContent='$'+Number(product.price).toFixed(2);$('stock').textContent=product.stock>0?'In stock: '+product.stock:'Currently unavailable';$('description').textContent=product.description||'Product information coming soon.';document.title=(product.seo_title||product.title)+' | TRISOCMD';document.querySelector('meta[name=description]').content=product.seo_description||product.description?.slice(0,155)||'TRISOCMD product details';if(admin)$('admin').classList.remove('hidden');await loadMedia()}catch(e){notice(e.message)}}
$('spec-form').onsubmit=async e=>{e.preventDefault();if(!admin||!product)return;const spec_key=$('spec-key').value.trim(),spec_value=$('spec-value').value.trim(),sort_order=Number($('spec-order').value)||0;if(!spec_key||!spec_value)return notice('Name and value are required.');try{await req('product_specs',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({product_id:product.id,spec_key,spec_value,sort_order})});$('spec-form').reset();notice('Specification saved.');await loadSpecs()}catch(err){notice(err.message)}};
$('media-form').onsubmit=async e=>{e.preventDefault();if(!admin||!product)return;const type=$('media-type').value,url=$('media-url').value.trim();if(type==='image'&&!safeImage(url))return notice('Image must use HTTPS.');if(type==='youtube'&&!videoId(url))return notice('Use a valid YouTube video link.');try{await req('product_media',{method:'POST',body:JSON.stringify({product_id:product.id,media_type:type,media_url:url,label:$('media-label').value.trim()||null,sort_order:Number($('media-order').value)||0})});$('media-form').reset();notice('Media added.');await loadMedia()}catch(err){notice(err.message)}};load();
</script></body></html>
