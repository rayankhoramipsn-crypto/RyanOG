<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TRISOCMD Journal — Staging</title><meta name="description" content="Gaming guides, product insights and community news from TRISOCMD."><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b0d14;color:#f0f1f7}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:24px}a{color:#b8a4ff}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #343544;padding-bottom:18px}h1{font-size:clamp(32px,5vw,60px);margin:40px 0 10px}p{line-height:1.7;color:#c4c6d4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.card,form{background:#161925;border:1px solid #303548;border-radius:18px;padding:22px}.card img{width:100%;height:180px;object-fit:cover;border-radius:12px}.muted{color:#a9aec3}input,textarea,select,button{font:inherit;width:100%;padding:11px;border-radius:9px;background:#0e101a;color:#fff;border:1px solid #41465c;margin:6px 0 14px}button{cursor:pointer;background:#7659d6;border:0;font-weight:700}button:disabled{opacity:.5}.actions{display:flex;gap:8px}.actions button{width:auto}.article{max-width:760px;margin:auto}.article img{max-width:100%;border-radius:16px}.article .body{white-space:pre-wrap;line-height:1.8}label{display:block}.hidden{display:none!important}#message{min-height:26px}a,button,input,select,textarea{outline-offset:4px}.card,.body{overflow-wrap:anywhere}.filters{display:flex;gap:12px;flex-wrap:wrap}.filters label{flex:1;min-width:180px}#editor-preview{white-space:pre-wrap;border-inline-start:3px solid #b8a4ff;padding:20px}button:disabled{cursor:wait}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><header><a href="../index.html">TRISOCMD / SHOP</a><strong>JOURNAL</strong><label>Language / زبان<select id="ui-language"><option value="en">English</option><option value="fa">فارسی</option><option value="ar">العربية</option></select></label><a href="../marketplace.html">Marketplace</a></header><main><h1>Stories for players.</h1><p>Guides, product insights and updates from TRISOCMD.</p><p id="message" role="status"></p><div class="filters" id="filters"><label>Search / جست‌وجو<input id="search" type="search" placeholder="Title, excerpt or topic"></label><label>Language / زبان<select id="filter-language"><option value="">All / همه</option><option value="en">English</option><option value="fa">فارسی</option><option value="ar">العربية</option></select></label></div><section id="listing" class="grid" aria-label="Published articles"></section><article id="article" class="article hidden"><button id="back" type="button">← All articles</button><h2 id="article-title"></h2><p id="article-meta"></p><img id="article-cover" alt="" class="hidden"><p id="article-body" class="body"></p></article><section id="admin" class="hidden"><h2>Editorial admin</h2><p class="muted">Requires an active administrator session from the staging shop.</p><form id="editor"><input type="hidden" id="post-id"><label>Title<input id="title" maxlength="180" required></label><label>Slug<input id="slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" required></label><label>Excerpt<textarea id="excerpt"></textarea></label><label>Body (plain text)<textarea id="body" rows="12" required></textarea></label><label>Cover image HTTPS URL<input id="cover" type="url"></label><label>Category<input id="category" value="Guides"></label><label>Language<select id="language"><option value="en">English</option><option value="fa">فارسی</option><option value="ar">العربية</option></select></label><label>SEO title<input id="seo-title"></label><label>SEO description<textarea id="seo-description"></textarea></label><label>Status<select id="status"><option value="draft">Draft</option><option value="published">Published</option><option value="archived">Archived</option></select></label><div class="actions"><button type="submit">Save article</button><button type="button" id="preview-draft">Preview / پیش‌نمایش</button><button id="new" type="button">New draft</button></div></form><article id="editor-preview" class="hidden" aria-label="Draft preview"></article><h3>All articles</h3><div id="admin-list"></div></section></main><script>
'use strict';
const API_BASE='https://cxtytbjvdlngahytfilr.supabase.co',KEY='sb_publishable_AqZWjpgyZ_h6-EKwOySyGQ_0LE8bcRm';
const $=id=>document.getElementById(id),notice=t=>{$('message').textContent=t};
let session=(()=>{try{return JSON.parse(sessionStorage.getItem('tc35_auth_session')||'null')}catch{return null}})();
let token=session?.access_token,admin=false;
let posts=[],allPosts=[],saving=false;
function node(tag,text){const e=document.createElement(tag);if(text!=null)e.textContent=text;return e}
function validImage(url){try{const u=new URL(url);return u.protocol==='https:'?u.href:null}catch{return null}}
async function authRequest(path,body){
 const response=await fetch(API_BASE+'/auth/v1/'+path,{method:body?'POST':'GET',headers:{apikey:KEY,'Content-Type':'application/json',...(!body&&token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});
 if(!response.ok){const error=Error('Sign in again / دوباره وارد شوید.');error.status=response.status;throw error}return response.json();
}
let verifying=null;
async function verifyAdmin(){
 if(verifying)return verifying;
 verifying=(async()=>{
  const renew=async()=>{
   if(!session?.refresh_token)throw Error('Sign in again / دوباره وارد شوید.');
   const renewed=await authRequest('token?grant_type=refresh_token',{refresh_token:session.refresh_token});
   if(!renewed.access_token||!renewed.refresh_token)throw Error('Invalid session response');
   session={...renewed,expires_at:renewed.expires_at||Math.floor(Date.now()/1000)+(renewed.expires_in||3600)};token=session.access_token;
   sessionStorage.setItem('tc35_auth_session',JSON.stringify(session));
  };
  try{
   if(!token)throw Error('Admin session required.');
   if(session.expires_at&&session.expires_at<Date.now()/1000+90)await renew();
   let user;try{user=await authRequest('user')}catch(error){if(error.status!==401)throw error;await renew();user=await authRequest('user')}
   session.user=user;admin=user.app_metadata?.role==='admin';
   if(!admin)throw Error('Admin session required.');
   sessionStorage.setItem('tc35_auth_session',JSON.stringify(session));return true;
  }catch(error){
   admin=false;allPosts=[];$('admin-list').replaceChildren();$('admin').classList.add('hidden');
   if([400,401,403].includes(error.status)){sessionStorage.removeItem('tc35_auth_session');session=null;token=null}
   throw error;
  }
 })().finally(()=>{verifying=null});return verifying;
}
async function req(path,options={}){
 const privileged=!!(options.method||options.admin);if(privileged)await verifyAdmin();
 const r=await fetch(API_BASE+'/rest/v1/'+path,{...options,headers:{apikey:KEY,Authorization:'Bearer '+(privileged?token:KEY),'Content-Type':'application/json',...(options.headers||{})}});
 if(!r.ok)throw Error('Request failed: '+r.status+' '+(await r.text()).slice(0,250));const t=await r.text();return t?JSON.parse(t):null;
}
function slugify(t){return t.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,110)}
function showArticle(p){$('listing').classList.add('hidden');$('article').classList.remove('hidden');$('article-title').textContent=p.title;$('article-meta').textContent=[p.category,p.published_at?new Date(p.published_at).toLocaleDateString():null].filter(Boolean).join(' · ');$('article-body').textContent=p.body;const lang=['en','fa','ar'].includes(p.language)?p.language:'en';$('article').lang=lang;$('article').dir=lang==='en'?'ltr':'rtl';$('filters').classList.add('hidden');const img=$('article-cover'),src=validImage(p.cover_image_url);img.classList.toggle('hidden',!src);if(src){img.src=src;img.alt=p.title;img.referrerPolicy='no-referrer';}else img.removeAttribute('src');document.title=(p.seo_title||p.title)+' | TRISOCMD Journal';document.querySelector('meta[name=description]').content=p.seo_description||p.excerpt||'TRISOCMD Journal';}
function showList(){history.replaceState(null,'',location.pathname);$('article').classList.add('hidden');$('listing').classList.remove('hidden');document.title='TRISOCMD Journal — Staging';document.querySelector('meta[name=description]').content='Gaming guides, product insights and community news from TRISOCMD.';$('filters').classList.remove('hidden');notice('');}
function render(){const el=$('listing');el.replaceChildren();if(!posts.length)el.append(node('p','No published articles yet.'));const query=$('search').value.trim().toLocaleLowerCase(),language=$('filter-language').value;const filtered=posts.filter(p=>(!language||p.language===language)&&(!query||[p.title,p.excerpt,p.category].some(v=>String(v||'').toLocaleLowerCase().includes(query))));if(posts.length&&!filtered.length)el.append(node('p','No matching articles / مقاله‌ای پیدا نشد.'));for(const p of filtered){const c=node('div');c.className='card';c.lang=p.language||'en';c.dir=['fa','ar'].includes(p.language)?'rtl':'ltr';const src=validImage(p.cover_image_url);if(src){const img=node('img');img.src=src;img.alt=p.title;img.loading='lazy';c.append(img)}c.append(node('h2',p.title),node('p',p.excerpt||''));const a=node('a','Read article →');a.href='?slug='+encodeURIComponent(p.slug);c.append(a);el.append(c)}const slug=new URLSearchParams(location.search).get('slug');if(slug){const p=posts.find(x=>x.slug===slug);if(p)showArticle(p);else notice('Article not found or not published.')}}
async function load(){notice('Loading articles / در حال دریافت مقاله‌ها…');try{posts=await req('blog_posts?select=id,slug,title,excerpt,body,cover_image_url,category,language,seo_title,seo_description,published_at&status=eq.published&published_at=lte.'+encodeURIComponent(new Date().toISOString())+'&order=published_at.desc');notice('');render();if(admin)await loadAdmin();return true}catch(e){notice(e.message);return false}}
function edit(p){$('editor-preview').classList.add('hidden');$('post-id').value=p.id;for(const [id,key] of [['title','title'],['slug','slug'],['excerpt','excerpt'],['body','body'],['cover','cover_image_url'],['category','category'],['language','language'],['seo-title','seo_title'],['seo-description','seo_description'],['status','status']])$(id).value=p[key]|| (id==='language'?'en':'');$('editor').scrollIntoView({behavior:'smooth'})}
async function loadAdmin(){const all=await req('blog_posts?select=*&order=created_at.desc',{admin:true});allPosts=all;const list=$('admin-list');list.replaceChildren();for(const p of all){const b=node('button',p.status.toUpperCase()+' — '+p.title);b.type='button';b.onclick=()=>edit(p);list.append(b)}}
$('back').onclick=showList;$('new').onclick=()=>{$('editor').reset();delete $('slug').dataset.manual;$('post-id').value='';$('status').value='draft';$('editor-preview').classList.add('hidden')};
$('title').addEventListener('input',()=>{if(!$('post-id').value&&!$('slug').dataset.manual)$('slug').value=slugify($('title').value)});
const translations={
 en:['Stories for players.','Guides, product insights and updates from TRISOCMD.','Editorial admin','Requires an active administrator session from the shop.','Save article','New draft','All articles','← All articles'],
 fa:['داستان‌هایی برای بازیکنان','راهنماهای بازی، بررسی محصولات و تازه‌های تریسوکمد.','مدیریت وبلاگ','با حساب مدیر از فروشگاه وارد شوید.','ذخیره مقاله','پیش‌نویس جدید','همه مقاله‌ها','← همه مقاله‌ها'],
 ar:['قصص للاعبين','أدلة الألعاب ومراجعات المنتجات وأخبار تريسوکمد.','إدارة المدونة','سجّل الدخول بحساب المسؤول من المتجر.','حفظ المقال','مسودة جديدة','جميع المقالات','← جميع المقالات']};
function localize(lang){
 const copy=translations[lang]||translations.en;document.documentElement.lang=lang;document.documentElement.dir=lang==='en'?'ltr':'rtl';
 const elements=[document.querySelector('main>h1'),document.querySelector('main>p'),document.querySelector('#admin>h2'),document.querySelector('#admin>p'),document.querySelector('#editor [type=submit]'),$('new'),document.querySelector('#admin>h3'),$('back')];elements.forEach((el,i)=>el.textContent=copy[i]);
 const labels={en:['Title','Slug','Excerpt','Body (plain text)','Cover image HTTPS URL','Category','Language','SEO title','SEO description','Status'],fa:['عنوان','نامک لاتین','خلاصه','متن مقاله (متن ساده)','آدرس HTTPS تصویر جلد','دسته‌بندی','زبان مقاله','عنوان سئو','توضیحات سئو','وضعیت'],ar:['العنوان','الاسم اللاتيني','الملخص','نص المقال','رابط صورة HTTPS','الفئة','لغة المقال','عنوان SEO','وصف SEO','الحالة']};
 document.querySelectorAll('#editor>label').forEach((el,i)=>{el.firstChild.textContent=(labels[lang]||labels.en)[i]});
 const states={en:['Draft','Published','Archived'],fa:['پیش‌نویس','منتشرشده','بایگانی‌شده'],ar:['مسودة','منشور','مؤرشف']};[...$('status').options].forEach((el,i)=>el.textContent=states[lang][i]);
}
$('ui-language').onchange=()=>localize($('ui-language').value);
$('search').oninput=render;$('filter-language').onchange=render;
$('slug').oninput=()=>{$('slug').dataset.manual='true'};
$('preview-draft').onclick=()=>{const preview=$('editor-preview');preview.replaceChildren(node('h2',$('title').value),node('p',$('excerpt').value),node('div',$('body').value));preview.lang=$('language').value;preview.dir=preview.lang==='en'?'ltr':'rtl';preview.classList.remove('hidden')};
$('editor').addEventListener('submit',async e=>{
 e.preventDefault();if(!admin)return notice('Admin session required.');if(saving)return;
 const id=$('post-id').value,status=$('status').value,previous=allPosts.find(p=>String(p.id)===id);
 const data={title:$('title').value.trim(),slug:$('slug').value.trim(),excerpt:$('excerpt').value.trim(),body:$('body').value,cover_image_url:$('cover').value.trim()||null,category:$('category').value.trim()||'Guides',language:$('language').value,seo_title:$('seo-title').value.trim()||null,seo_description:$('seo-description').value.trim()||null,status,published_at:status==='published'?(previous?.published_at||new Date().toISOString()):null,updated_at:new Date().toISOString()};
 if(!data.title||!data.body.trim()||!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(data.slug))return notice('Title, body and a valid Latin slug are required / عنوان، متن و نامک لاتین معتبر لازم است.');
 if(data.cover_image_url&&!validImage(data.cover_image_url))return notice('Cover image must use HTTPS / آدرس تصویر باید HTTPS باشد.');
 const button=$('editor').querySelector('[type=submit]');saving=true;button.disabled=true;notice('Saving / در حال ذخیره…');
 try{
 const saved=await req('blog_posts'+(id?'?id=eq.'+encodeURIComponent(id):''),{method:id?'PATCH':'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(id?data:{...data,author_id:session.user.id})});
 if(!saved?.length)throw Error('No article was saved. Check your administrator permissions.');
 $('post-id').value=saved[0].id;const loaded=await load();if(loaded)notice('Saved successfully / مقاله ذخیره شد.');
 }catch(err){notice(err.message)}finally{saving=false;button.disabled=false}
});
async function initialize(){
 if(token){try{await verifyAdmin()}catch{}}
 $('admin').classList.toggle('hidden',!admin);await load();
}
initialize();
</script></body></html>
