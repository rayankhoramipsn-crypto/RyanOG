<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My account | TRISOCMD</title><style>:root{color-scheme:dark;font:16px/1.6 system-ui;background:#0b0d13;color:#f3f2f8}body{max-width:800px;margin:auto;padding:24px}a{color:#c4b1ff}button{font:inherit;padding:10px;background:#7459d3;color:white;border:0;border-radius:8px}li{padding:12px;border-bottom:1px solid #333}[hidden]{display:none!important}</style></head><body><a href="index.html">TRISOCMD / Store</a><h1>My account</h1><p id="status" role="status">Checking session…</p><main id="account" hidden><p id="identity"></p><button id="logout">Sign out</button><h2>My orders</h2><ul id="orders"></ul><a href="marketplace.html">Marketplace</a></main><script src="auth.js"></script><script>
(async()=>{'use strict';const $=id=>document.getElementById(id);try{const session=await TrisoAuth.requireSession();if(!session)return;$('identity').textContent=session.user.email||'Signed in';$('account').hidden=false;$('status').textContent='Loading orders…';const headers=await TrisoAuth.headers();const response=await fetch('https://cxtytbjvdlngahytfilr.supabase.co/rest/v1/tc42_orders?select=id,status,total_amount,currency,created_at&order=created_at.desc&limit=30',{headers});if(!response.ok)throw Error('Orders unavailable. Please try again.');const orders=await response.json();for(const order of orders){const li=document.createElement('li');li.textContent=[String(order.id).slice(0,8),order.status,order.total_amount+' '+order.currency,new Date(order.created_at).toLocaleDateString()].join(' · ');$('orders').append(li)}$('status').textContent=orders.length?'':'No orders yet.'}catch(error){$('status').textContent=error.message}$('logout').onclick=async()=>{try{await TrisoAuth.signOut();location.replace('auth.html')}catch{$('account').hidden=true;$('status').textContent='Local session cleared. Server sign-out could not be confirmed. Please retry when connected.'}}})();
</script></body></html>
