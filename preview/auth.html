<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sign in | TRISOCMD</title><style>:root{color-scheme:dark;font:16px/1.6 system-ui;background:#0b0d13;color:#f3f2f8}body{max-width:440px;margin:8vh auto;padding:24px}a{color:#c4b1ff}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #555a71;border-radius:8px;background:#171b29;color:white}button{cursor:pointer;margin:8px 0}button[type=submit]{background:#7459d3}#status{min-height:2em}</style></head><body><a href="index.html">TRISOCMD / Store</a><h1>Sign in</h1><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required maxlength="254"></label><label>Password<input id="password" type="password" autocomplete="current-password" required minlength="8"></label><button type="submit">Sign in</button><button type="button" id="signup">Create account</button></form><p id="status" role="status" aria-live="polite"></p><p>Password recovery is available from Account in the <a href="index.html">store</a>.</p><script src="auth.js"></script><script>
'use strict';
const form=document.getElementById('login'),status=document.getElementById('status');
const next=TrisoAuth.safeReturn(new URLSearchParams(location.search).get('next'));
async function submit(signup){if(!form.reportValidity())return;const buttons=[...form.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);status.textContent='Please wait…';try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const session=await TrisoAuth[signup?'signUp':'signIn'](email,password);document.getElementById('password').value='';if(session)location.replace(next);else status.textContent='Check your email to confirm your account, then sign in.'}catch(error){status.textContent=error.message}finally{buttons.forEach(b=>b.disabled=false)}}
form.onsubmit=event=>{event.preventDefault();submit(false)};document.getElementById('signup').onclick=()=>submit(true);
</script></body></html>
