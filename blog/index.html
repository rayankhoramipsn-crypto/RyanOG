<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TRISOCMD Journal — Staging</title><meta name="description" content="Gaming guides, product insights and community news from TRISOCMD."><style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b0d14;color:#f0f1f7}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:24px}a{color:#b8a4ff}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #343544;padding-bottom:18px}h1{font-size:clamp(32px,5vw,60px);margin:40px 0 10px}p{line-height:1.7;color:#c4c6d4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.card,form{background:#161925;border:1px solid #303548;border-radius:18px;padding:22px}.card img{width:100%;height:180px;object-fit:cover;border-radius:12px}.muted{color:#a9aec3}input,textarea,select,button{font:inherit;width:100%;padding:11px;border-radius:9px;background:#0e101a;color:#fff;border:1px solid #41465c;margin:6px 0 14px}button{cursor:pointer;background:#7659d6;border:0;font-weight:700}button:disabled{opacity:.5}.actions{display:flex;gap:8px}.actions button{width:auto}.article{max-width:760px;margin:auto}.article img{max-width:100%;border-radius:16px}.article .body{white-space:pre-wrap;line-height:1.8}label{display:block}.hidden{display:none!important}#message{min-height:26px}</style><link rel="stylesheet" href="../assets/commerce.css"><script src="../assets/session.js"></script></head><body><header><a href="../index.html">TRISOCMD / SHOP</a><strong>JOURNAL</strong><a href="../marketplace.html">Marketplace</a></header><main><h1>Stories for players.</h1><p>Guides, product insights and updates from TRISOCMD.</p><p id="message" role="status"></p><div class="listing-filters" id="article-filters"><input id="article-search" type="search" aria-label="Search articles" placeholder="Search articles…"><select id="article-category" aria-label="Article category"><option value="">All categories</option></select></div><section id="listing" class="grid" aria-label="Published articles"></section><article id="article" class="article hidden"><button id="back" type="button">← All articles</button><h2 id="article-title" data-user-content></h2><p id="article-meta" data-user-content></p><img id="article-cover" alt="" class="hidden"><p id="article-body" class="body"></p><section id="related-articles"><h3>Related articles</h3><div id="related-list" class="grid"></div></section></article><section id="admin" class="hidden"><h2>Editorial admin</h2><p class="muted">Requires an active administrator session from the staging shop.</p><form id="editor"><input type="hidden" id="post-id"><label>Title<input id="title" maxlength="180" required></label><label>Slug<input id="slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" required></label><label>Excerpt<textarea id="excerpt"></textarea></label><label>Body (plain text)<textarea id="body" rows="12" required></textarea></label><label>Cover image HTTPS URL<input id="cover" type="url"></label><label>Category<input id="category" value="Guides"></label><label>Language<select id="language"><option value="en">English</option><option value="fa">فارسی</option><option value="ar">العربية</option></select></label><label>SEO title<input id="seo-title"></label><label>SEO description<textarea id="seo-description"></textarea></label><label>Status<select id="status"><option value="draft">Draft</option><option value="published">Published</option><option value="archived">Archived</option></select></label><div class="actions"><button type="submit">Save article</button><button id="new" type="button">New draft</button></div></form><h3>All articles</h3><div id="admin-list"></div></section></main><script>
(async()=>{await Triso.ready;

'use strict';
const API_URL=Triso.config.url,KEY=Triso.config.key;
const $=id=>document.getElementById(id),notice=t=>{$('message').textContent=t};
const session=(()=>{try{return JSON.parse(sessionStorage.getItem('tc35_auth_session')||'null')}catch{return null}})();
const token=session?.access_token,admin=session?.user?.app_metadata?.role==='admin';
let posts=[];
function node(tag,text){const e=document.createElement(tag);if(text!=null)e.textContent=text;return e}
function validImage(url){try{const u=new URL(url);return u.protocol==='https:'?u.href:null}catch{return null}}
async function req(path,options={}){const r=await fetch(API_URL+'/rest/v1/'+path,{...options,headers:{apikey:KEY,...(token?{Authorization:'Bearer '+token}:{}),'Content-Type':'application/json',...(options.headers||{})}});if(!r.ok)throw Error('Request failed: '+r.status+' '+(await r.text()).slice(0,250));const t=await r.text();return t?JSON.parse(t):null}
function slugify(t){return t.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,110)}
function showArticle(p){$('listing').classList.add('hidden');$('article-filters').classList.add('hidden');$('article').classList.remove('hidden');$('article-title').textContent=p.title;$('article-meta').textContent=[p.category,p.published_at?new Date(p.published_at).toLocaleDateString():null].filter(Boolean).join(' · ');$('article-body').textContent=p.body;const img=$('article-cover'),src=validImage(p.cover_image_url);img.classList.toggle('hidden',!src);if(src){img.src=src;img.alt=p.title;img.loading='lazy'}else img.removeAttribute('src');document.title=(p.seo_title||p.title)+' | TRISOCMD Journal';document.querySelector('meta[name=description]').content=p.seo_description||p.excerpt||'TRISOCMD Journal';$('article').lang=p.language||'en';$('article').dir=['fa','ar'].includes(p.language)?'rtl':'ltr';const related=$('related-list');related.replaceChildren();for(const item of posts.filter(x=>x.id!==p.id&&x.category===p.category&&x.language===p.language).slice(0,3)){const link=node('a',item.title);link.href='?slug='+encodeURIComponent(item.slug);related.append(link)}$('related-articles').hidden=!related.children.length;let schema=document.getElementById('article-schema');if(!schema){schema=node('script');schema.id='article-schema';schema.type='application/ld+json';document.head.append(schema)}schema.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Article',headline:p.title,description:p.seo_description||p.excerpt||'',datePublished:p.published_at,inLanguage:p.language,image:validImage(p.cover_image_url)||undefined}).replace(/</g,'\\u003c');}
function showList(){history.replaceState(null,'',location.pathname);$('article').classList.add('hidden');$('listing').classList.remove('hidden');$('article-filters').classList.remove('hidden');document.title='TRISOCMD Journal — Staging';}
function render(){const el=$('listing');el.replaceChildren();if(!posts.length)el.append(node('p','No published articles yet.'));const categories=[...new Set(posts.map(p=>p.category).filter(Boolean))].sort(),prior=$('article-category').value;$('article-category').replaceChildren(new Option('All categories',''),...categories.map(c=>new Option(c,c)));$('article-category').value=categories.includes(prior)?prior:'';const query=$('article-search').value.toLowerCase(),category=$('article-category').value;for(const p of posts.filter(p=>(!category||p.category===category)&&(!query||[p.title,p.excerpt].some(t=>String(t||'').toLowerCase().includes(query))))){const c=node('article');c.className='card';const src=validImage(p.cover_image_url);if(src){const img=node('img');img.src=src;img.alt=p.title;img.loading='lazy';c.append(img)}const heading=node('h2',p.title),excerpt=node('p',p.excerpt||'');heading.dataset.userContent='';excerpt.dataset.userContent='';c.append(heading,excerpt);const a=node('a','Read article →');a.href='?slug='+encodeURIComponent(p.slug);c.append(a);el.append(c)}const slug=new URLSearchParams(location.search).get('slug');if(slug){const p=posts.find(x=>x.slug===slug);if(p)showArticle(p);else notice('Article not found or not published.')}}
async function load(){try{posts=await req('blog_posts?select=id,slug,title,excerpt,body,cover_image_url,category,language,seo_title,seo_description,published_at&status=eq.published&published_at=lte.'+encodeURIComponent(new Date().toISOString())+'&order=published_at.desc');render();if(admin)await loadAdmin()}catch(e){notice(e.message)}}
function edit(p){$('post-id').value=p.id;for(const [id,key] of [['title','title'],['slug','slug'],['excerpt','excerpt'],['body','body'],['cover','cover_image_url'],['category','category'],['language','language'],['seo-title','seo_title'],['seo-description','seo_description'],['status','status']])$(id).value=p[key]|| (id==='language'?'en':'');$('editor').scrollIntoView({behavior:'smooth'})}
async function loadAdmin(){const all=await req('blog_posts?select=*&order=created_at.desc');const list=$('admin-list');list.replaceChildren();for(const p of all){const b=node('button',p.status.toUpperCase()+' — '+p.title);b.type='button';b.onclick=()=>edit(p);list.append(b)}}
$('article-search').oninput=render;$('article-category').onchange=render;$('back').onclick=showList;$('new').onclick=()=>{$('editor').reset();$('post-id').value='';$('status').value='draft'};
$('title').addEventListener('input',()=>{if(!$('post-id').value)$('slug').value=slugify($('title').value)});
$('editor').addEventListener('submit',async e=>{e.preventDefault();if(!admin)return notice('Admin session required.');const button=$('editor').querySelector('[type=submit]');button.disabled=true;try{const id=$('post-id').value,previous=id?(await req('blog_posts?select=published_at,status&id=eq.'+encodeURIComponent(id)))[0]:null;const status=$('status').value;const data={title:$('title').value.trim(),slug:$('slug').value.trim(),excerpt:$('excerpt').value.trim(),body:$('body').value,cover_image_url:$('cover').value.trim()||null,category:$('category').value.trim()||'Guides',language:$('language').value,seo_title:$('seo-title').value.trim()||null,seo_description:$('seo-description').value.trim()||null,status,published_at:status==='published'?(previous?.published_at||new Date().toISOString()):null,updated_at:new Date().toISOString()};if(!data.title||!data.slug||!data.body.trim())throw Error('Title, slug and body are required.');if(data.cover_image_url&&!validImage(data.cover_image_url))throw Error('Cover image must use HTTPS.');if(id)await req('blog_posts?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(data)});else await req('blog_posts',{method:'POST',body:JSON.stringify({...data,author_id:session.user.id})});notice('Saved successfully.');await load()}catch(err){notice(err.message)}finally{button.disabled=false}});
if(admin){$('admin').classList.remove('hidden')}load();

})();
</script><script src="../assets/locales.js"></script><script src="../assets/commerce.js"></script></body></html>
