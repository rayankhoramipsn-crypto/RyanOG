<link rel="stylesheet" href="../assets/triso-content.css"></head><body><a class="content-skip" href="#article-title">Skip to content</a><header><a href="../index.html">TRISOCMD / SHOP</a><strong data-content="journal">JOURNAL</strong><a href="../marketplace.html">Marketplace</a></header><main><h1 data-content="stories">Stories for players.</h1><p>Guides, product insights and updates from TRISOCMD.</p><p id="message" role="status"></p><div class="content-tools"><input id="article-search" type="search" aria-label="Search articles" data-content-placeholder="search"><select id="article-category" aria-label="Article category"><option value="" data-content="all">All categories</option></select><button type="button" id="retry-content" data-content="retry">Retry</button></div><section id="listing" class="grid" aria-label="Published articles"></section><article id="article" class="article hidden"><button id="back" data-content="back" type="button">← All articles</button><h2 id="article-title"></h2><p id="article-meta"></p><img id="article-cover" width="960" height="540" decoding="async" alt="" class="hidden"><p id="article-body" class="body"></p></article><section id="admin" class="hidden"><h2>Editorial admin</h2><p class="muted">Requires an active administrator session from the staging shop.</p><form id="editor"><input type="hidden" id="post-id"><label>Title<input id="title" maxlength="180" required></label><label>Slug<input id="slug" pattern="[a-z0-9]+(-[a-z0-9]+)*" required></label><label>Excerpt<textarea id="excerpt"></textarea></label><label>Body (plain text)<textarea id="body" rows="12" required></textarea></label><label>Cover image HTTPS URL<input id="cover" type="url"></label><p data-content="publicAsset">Uploaded images are public. PNG, JPEG or WebP, up to 5 MB.</p><label>Cover image file<input type="file" id="cover-file" accept="image/png,image/jpeg,image/webp"></label><button type="button" id="upload-cover" data-content="upload">Upload image</button><label>Category<input id="category" value="Guides"></label><label>Language<select id="language"><option value="en">English</option><option value="fa">فارسی</option><option value="ar">العربية</option></select></label><label>SEO title<input id="seo-title"></label><label>SEO description<textarea id="seo-description"></textarea></label><label>Status<select id="status"><option value="draft">Draft</option><option value="published">Published</option><option value="archived">Archived</option></select></label><label>Publication time (UTC, optional)<input id="published-at" type="datetime-local"></label><div class="actions"><button type="submit">Save article</button><button id="new" type="button">New draft</button></div></form><button type="button" id="export-content">Export public site content</button><h3>All articles</h3><label>Find article in admin<input id="admin-post-search" type="search"></label><div id="admin-list"></div></section></main><script src="../assets/triso-auth-storage.js?v=2"></script>
<script src="../assets/triso-content.js"></script><script type="module" src="../assets/content-snapshot.mjs"></script><script>
'use strict';const C=window.TrisoContent,$=id=>document.getElementById(id),notice=t=>{$('message').textContent=t};let posts=[],adminPosts=[],adminPage=0,admin=false,draftId=crypto.randomUUID();
function node(tag,text){const e=document.createElement(tag);if(text!=null)e.textContent=text;return e}
function validImage(v){return C.image(v)}
const req=C.request;
function slugify(t){return t.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,110)}
function showArticle(p){$('listing').classList.add('hidden');$('article').classList.remove('hidden');$('article-title').textContent=p.title;$('article-meta').textContent=[p.category,p.published_at?new Date(p.published_at).toLocaleDateString():null].filter(Boolean).join(' · ');$('article-body').textContent=p.body;const img=$('article-cover'),src=validImage(p.cover_image_url);img.classList.toggle('hidden',!src);img.alt=p.title;if(src)img.src=src;else img.removeAttribute('src');C.paint(p.language||'en');const url='https://trisocmd.shop/blog/'+p.slug+'/';C.metadata({title:p.seo_title||p.title,description:p.seo_description||p.excerpt||p.title,url,image:src,type:'article',schema:{'@context':'https://schema.org','@type':'Article',headline:p.title,datePublished:p.published_at,inLanguage:p.language||'en',mainEntityOfPage:url,image:src||undefined}});$('article-title').setAttribute('tabindex','-1');$('article-title').focus()}
function showList(){history.replaceState(null,'',location.pathname);$('article').classList.add('hidden');$('listing').classList.remove('hidden');C.paint(C.language());C.metadata({title:'TRISOCMD Journal',description:'Guides, product insights and updates for players.',url:'https://trisocmd.shop/blog/'});render()}
function render(){const el=$('listing'),q=$('article-search').value.trim().toLocaleLowerCase(),cat=$('article-category').value;el.replaceChildren();const filtered=posts.filter(p=>(!cat||p.category===cat)&&(!q||[p.title,p.excerpt,p.category].some(v=>String(v||'').toLocaleLowerCase().includes(q))));if(!filtered.length)el.append(node('p',C.t('none')));for(const p of filtered){const c=node('div');c.className='card';const src=validImage(p.cover_image_url);if(src){const img=node('img');img.src=src;img.alt=p.title;img.loading='lazy';img.decoding='async';img.width=600;img.height=340;c.append(img)}c.append(node('h2',p.title),node('p',p.excerpt||''));const a=node('a',C.t('read'));a.href=(location.pathname.includes('/preview/')?'/preview':'')+'/blog/'+p.slug+'/';a.onclick=e=>{e.preventDefault();history.pushState(null,'',location.pathname+'?slug='+encodeURIComponent(p.slug));openArticle(p.slug)};c.append(a);el.append(c)}}
async function openArticle(slug){try{if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug))throw Error('Invalid article URL');const rows=await req('blog_posts?select=*&slug=eq.'+encodeURIComponent(slug)+'&status=eq.published&published_at=lte.'+encodeURIComponent(new Date().toISOString()));if(rows?.[0])showArticle(rows[0]);else{showList();notice('Article not found or not published.')}}catch(e){notice(e.message)}}
async function load(){notice(C.t('loading'));try{posts=await C.all('blog_posts?select=id,slug,title,excerpt,cover_image_url,category,language,seo_title,seo_description,published_at&status=eq.published&published_at=lte.'+encodeURIComponent(new Date().toISOString())+'&order=published_at.desc,id.desc');const prior=$('article-category').value;$('article-category').replaceChildren(new Option(C.t('all'),''));for(const category of [...new Set(posts.map(p=>p.category))].sort())$('article-category').add(new Option(category,category));$('article-category').value=prior;$('article').classList.add('hidden');for(const key of ['article-title','article-meta','article-body'])$(key).textContent='';$('article-cover').removeAttribute('src');$('article-cover').classList.add('hidden');C.metadata({title:'TRISOCMD Journal',description:'Guides, product insights and updates for players.',url:'https://trisocmd.shop/blog/'});$('listing').classList.remove('hidden');render();notice('');if(new URLSearchParams(location.search).get('slug'))await openArticle(new URLSearchParams(location.search).get('slug'));try{admin=await req('rpc/is_admin',{method:'POST',body:'{}'})===true}catch{admin=false}$('admin').classList.toggle('hidden',!admin);if(admin)await loadAdmin();else{adminPosts=[];$('admin-list').replaceChildren();$('editor').reset();$('post-id').value=''}}catch(e){notice(e.message)}}
function edit(p){$('post-id').value=p.id;for(const [id,key]of [['title','title'],['slug','slug'],['excerpt','excerpt'],['body','body'],['cover','cover_image_url'],['category','category'],['language','language'],['seo-title','seo_title'],['seo-description','seo_description'],['status','status']])$(id).value=p[key]||(id==='language'?'en':'');$('published-at').value=p.published_at?new Date(p.published_at).toISOString().slice(0,16):'';$('editor').scrollIntoView({block:'start'})}
async function loadAdmin(){adminPosts=await C.all('blog_posts?select=*&order=created_at.desc,id.desc');const selected=adminPosts.findIndex(p=>p.id===$('post-id').value);if(selected>=0)adminPage=Math.floor(selected/25);renderAdmin()}
function renderAdmin(){const q=$('admin-post-search').value.trim().toLowerCase(),all=adminPosts.filter(p=>[p.title,p.slug,p.status].some(v=>String(v).toLowerCase().includes(q))),list=$('admin-list');adminPage=Math.min(adminPage,Math.max(0,Math.ceil(all.length/25)-1));list.replaceChildren();for(const p of all.slice(adminPage*25,(adminPage+1)*25)){const b=node('button',p.status.toUpperCase()+' — '+p.title);b.type='button';b.onclick=()=>edit(p);const preview=node('button','Preview '+p.title);preview.type='button';preview.onclick=()=>showArticle(p);const remove=node('button','Delete '+p.title);remove.type='button';remove.onclick=async()=>{if(!confirm('Delete this article? This cannot be undone.'))return;remove.disabled=true;try{await req('blog_posts?id=eq.'+encodeURIComponent(p.id),{method:'DELETE'});await load();if($('post-id').value===p.id){$('editor').reset();$('post-id').value='';draftId=crypto.randomUUID()}notice('Article deleted.')}catch(e){notice(e.message);remove.disabled=false}};const row=node('div');row.className='media-edit';row.append(b,preview,remove);list.append(row)}const previous=node('button','Previous articles'),next=node('button','Next articles');previous.type=next.type='button';previous.disabled=adminPage===0;next.disabled=(adminPage+1)*25>=all.length;previous.onclick=()=>{adminPage--;renderAdmin()};next.onclick=()=>{adminPage++;renderAdmin()};list.append(node('p',all.length+' articles · Page '+(adminPage+1)),previous,next)}
$('back').onclick=showList;$('new').onclick=()=>{$('editor').reset();$('post-id').value='';$('status').value='draft';draftId=crypto.randomUUID()};
$('title').addEventListener('input',()=>{if(!$('post-id').value&&slugify($('title').value))$('slug').value=slugify($('title').value)});
$('editor').addEventListener('submit',async e=>{e.preventDefault();if(!admin)return notice('Admin session required.');const button=e.submitter;if(button.disabled)return;button.disabled=true;try{const id=$('post-id').value,status=$('status').value,previous=id?(await req('blog_posts?select=published_at,status&id=eq.'+encodeURIComponent(id)))[0]:null;const scheduled=$('published-at').value?new Date($('published-at').value+'Z').toISOString():null;const data={title:$('title').value.trim(),slug:$('slug').value.trim(),excerpt:$('excerpt').value.trim(),body:$('body').value,cover_image_url:$('cover').value.trim()||null,category:$('category').value.trim()||'Guides',language:$('language').value,seo_title:$('seo-title').value.trim()||null,seo_description:$('seo-description').value.trim()||null,status,published_at:status==='published'?(scheduled||previous?.published_at||new Date().toISOString()):null,updated_at:new Date().toISOString()};if(!data.title||!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(data.slug)||!data.body.trim())throw Error('Title, valid slug and body are required.');if(data.cover_image_url&&!validImage(data.cover_image_url))throw Error('Cover must use a safe HTTPS image URL.');if(id)await req('blog_posts?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(data)});else{await req('blog_posts?on_conflict=id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates'},body:JSON.stringify({...data,id:draftId,author_id:window.TrisoAuth.read().user.id})});$('post-id').value=draftId}await load();notice('Saved successfully.')}catch(err){notice(err.message)}finally{button.disabled=false}});
$('upload-cover').onclick=async()=>{const b=$('upload-cover');b.disabled=true;try{$('cover').value=await C.upload($('cover-file').files[0]);notice('Uploaded public cover. Save the article to attach it.')}catch(e){notice(e.message)}finally{b.disabled=false}};
$('export-content').onclick=async()=>{const b=$('export-content');b.disabled=true;try{const source=await window.TrisoContentExport();const blob=new Blob([JSON.stringify(source,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download='trisocmd-published.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice('Public content snapshot exported. Drafts and future publications excluded.')}catch(e){notice(e.message)}finally{b.disabled=false}};
$('admin-post-search').oninput=()=>{adminPage=0;renderAdmin()};$('article-search').oninput=render;$('article-category').onchange=render;$('retry-content').onclick=load;window.addEventListener('popstate',()=>{const slug=new URLSearchParams(location.search).get('slug');slug?openArticle(slug):showList()});C.initLanguage();window.addEventListener('content-language',render);let owner=window.TrisoAuth.read()?.user?.id;setInterval(()=>{if(window.TrisoAuth.read()?.user?.id!==owner){$('admin').classList.add('hidden');$('admin-list').replaceChildren();$('editor').reset();$('article-body').textContent='';location.reload()}},750);load();

</script></body></html>
